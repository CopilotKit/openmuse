name: Bug report
description: Report a reproducible OpenFuse failure
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior. Use fictional data; remove tokens and personal information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web
        - iOS
        - Android
        - API or worker
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and safe logs
      description: Node/OS versions, sample or live mode, configured backend names, and redacted error text. Do not attach .env or database files.
