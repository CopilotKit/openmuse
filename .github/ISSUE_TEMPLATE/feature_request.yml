name: Feature request
description: Suggest a personal-agent workflow or integration
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: What outcome should OpenFuse handle?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the user interaction, data sources, and actions involved.
  - type: textarea
    id: validation
    attributes:
      label: How would we verify it works?
      description: Note required APIs, test accounts, or platform dependencies.
